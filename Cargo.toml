[package]
name = "hace-uni-loader"
version = "0.1.0"
edition = "2021"
description = "Universal WASM Artifact Ingestion & Hacetime Authority Binder"

[lib]
name = "hace_uni_loader"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
hace-uni-config = { path = "../config" }
hace-uni-resolver = { path = "../resolver" }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }